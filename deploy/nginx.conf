# Nginx config for Ledger app
# DOMAIN_PLACEHOLDER is replaced by setup.sh

server {
    listen 80;
    server_name DOMAIN_PLACEHOLDER;
    # Certbot will add SSL redirect here automatically
}

server {
    listen 80;
    server_name DOMAIN_PLACEHOLDER;

    # Max upload size (for future file attachments)
    client_max_body_size 16M;

    # Proxy all requests to Gunicorn
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Static files served directly by Nginx (faster)
    location /static/ {
        alias /home/ledger/app/app/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
