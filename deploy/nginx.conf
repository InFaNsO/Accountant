# Nginx config for Ledger app
# DOMAIN_PLACEHOLDER is replaced by setup.sh

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    server_name DOMAIN_PLACEHOLDER;
    return 301 https://$host$request_uri;
}

# ── HTTPS + proxy ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name DOMAIN_PLACEHOLDER;

    # SSL — Certbot fills these in automatically
    ssl_certificate     /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Max upload size
    client_max_body_size 16M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Static files served directly by Nginx (faster, no Gunicorn overhead)
    location /static/ {
        alias /home/ledger/app/app/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # MCP Server (SSE) — Claude Desktop & Android remote connection
    location /mcp/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        '';

        # SSE requires no buffering and long-lived connections
        proxy_buffering            off;
        proxy_cache                off;
        proxy_read_timeout         3600s;
        chunked_transfer_encoding  on;
    }

    # All other requests → Gunicorn
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
