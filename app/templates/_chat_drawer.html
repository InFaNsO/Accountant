{# Sticky assistant: a launcher and a slide-over panel on every page.
   Rendered only for users whose chat_level isn't 'none' and only when the
   server actually has a model configured. #}
<button class="chat-fab" title="Ask the assistant" aria-label="Ask the assistant">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
  </svg>
  <span class="chat-fab-badge" style="display:none">0</span>
</button>

<aside class="chat-drawer" id="chatDrawer" aria-label="Assistant">
  <div class="chat-drawer-head">
    <span class="chat-drawer-title">Assistant</span>
    <div class="chat-tabs">
      <button class="chat-tab active" data-tab="ask">Ask</button>
      <button class="chat-tab" data-tab="inbox">Inbox</button>
    </div>
    <button class="chat-icon-btn chat-clear" title="Clear this conversation" aria-label="Clear conversation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
      </svg>
    </button>
    <button class="chat-icon-btn chat-close" title="Close" aria-label="Close assistant">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="chat-pane active"><div class="chat-pane-ask" style="flex:1;min-height:0;display:flex;flex-direction:column"></div></div>
  <div class="chat-pane"><div class="chat-pane-inbox"></div></div>
</aside>
