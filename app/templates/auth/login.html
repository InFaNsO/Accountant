<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Ledger</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg-alt); }
    .login-card {
      background:var(--bg);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:0 8px 40px rgba(0,0,0,.12);
      padding:40px 44px;
      width:100%;
      max-width:400px;
      margin:16px;
    }
    @media (max-width: 480px) {
      .login-card { padding:28px 22px; }
    }
    .login-logo {
      font-size:22px;
      font-weight:800;
      color:var(--accent);
      letter-spacing:-.5px;
      margin-bottom:6px;
    }
    .login-sub { font-size:13px; color:var(--text-muted); margin-bottom:32px; }
    .login-card .form-group { margin-bottom:18px; }
    .login-card label { display:block; font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.4px; }
    .login-card input[type=email],
    .login-card input[type=password] { width:100%; }
    .login-footer { margin-top:10px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .remember-row { display:flex; align-items:center; gap:7px; font-size:13px; color:var(--text-muted); }
    .remember-row input[type=checkbox] { width:auto; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">📒 Ledger</div>
    <div class="login-sub">Sign in to your account</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }}" style="margin-bottom:18px;padding:10px 14px;border-radius:var(--radius-sm);
          background:{% if cat=='error' %}rgba(239,68,68,.1){% else %}rgba(16,185,129,.1){% endif %};
          color:{% if cat=='error' %}var(--danger){% else %}var(--success){% endif %};
          font-size:13px;border:1px solid {% if cat=='error' %}rgba(239,68,68,.25){% else %}rgba(16,185,129,.25){% endif %}">
          {{ msg }}
        </div>
      {% endfor %}
    {% endwith %}

    <form method="post">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email }}"
               placeholder="you@example.com" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <div class="login-footer">
        <label class="remember-row">
          <input type="checkbox" name="remember"> Remember me
        </label>
        <button type="submit" class="btn btn-primary" style="flex-shrink:0">Sign In →</button>
      </div>
    </form>
  </div>
</body>
</html>
