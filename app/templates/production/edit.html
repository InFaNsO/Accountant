{% extends "base.html" %}
{% block title %}Edit Production Order{% endblock %}
{% block page_title %}Edit Production Order{% endblock %}
{% block topbar_actions %}
  <a href="{{ url_for('production.detail', po_id=po_id) }}" class="btn btn-secondary">Cancel</a>
{% endblock %}
{% block content %}
<div class="card" style="max-width:620px">
  <div class="card-header">
    <span class="card-title">Edit Header</span>
    <span style="font-size:12px;color:var(--text-muted)">Items cannot be changed after creation</span>
  </div>
  <div class="card-body">
    <form method="post" action="{{ url_for('production.edit_production', po_id=po_id) }}">
      <div class="form-grid form-grid-2">
        <div class="form-group">
          <label>Order Name *</label>
          <input type="text" name="name" value="{{ po.get('name','') }}" required>
        </div>
        <div class="form-group">
          <label>Supplier</label>
          <select name="supplier_id">
            <option value="">— None —</option>
            {% for s in suppliers %}
            <option value="{{ s.id }}" {{ 'selected' if po.get('supplier_id')|string == s.id|string }}>{{ s.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Expected Completion</label>
          <input type="date" name="expected_completion" value="{{ po.get('expected_completion','') }}">
        </div>
        <div class="form-group">
          <label>Notes</label>
          <input type="text" name="notes" value="{{ po.get('notes','') }}">
        </div>
      </div>
      <div class="form-actions mt-16">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('production.detail', po_id=po_id) }}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
