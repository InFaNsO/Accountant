{% if show_region_map %}
<!-- ── Client coverage map (consolidated regions, one colour per client) ── -->
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  /* MapLibre popups default to a white box + black text — force them onto
     the app's theme variables so they stay readable in dark mode too. */
  #rcmMap .maplibregl-popup-content {
    background: var(--surface);
    color: var(--text-primary);
    box-shadow: var(--shadow-md);
    border: 1px solid var(--border);
    font-size: 12.5px;
  }
  #rcmMap .maplibregl-popup-anchor-bottom .maplibregl-popup-tip { border-top-color: var(--surface); }
  #rcmMap .maplibregl-popup-anchor-top .maplibregl-popup-tip { border-bottom-color: var(--surface); }
  #rcmMap .maplibregl-popup-anchor-left .maplibregl-popup-tip { border-right-color: var(--surface); }
  #rcmMap .maplibregl-popup-anchor-right .maplibregl-popup-tip { border-left-color: var(--surface); }
  #rcmMap .maplibregl-popup-close-button { color: var(--text-primary); }
  .rcm-client-link { cursor: pointer; color: inherit; text-decoration: none; }
  .rcm-client-link:hover { text-decoration: underline; color: var(--accent); }

  /* Full-screen expand: the card pops out to a near-viewport-filling popup,
     everything inside (map, empty-state, legend) reflows to fill it. */
  #rcmBackdrop {
    display: none; position: fixed; inset: 0; z-index: 9998;
    background: rgba(0,0,0,.55);
  }
  #rcmBackdrop.active { display: block; }
  #rcmCard.map-fullscreen {
    position: fixed; inset: 3vh; z-index: 9999; margin: 0;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  #rcmCard.map-fullscreen .card-body {
    flex: 1; display: flex; flex-direction: column; overflow: auto;
  }
  #rcmCard.map-fullscreen #rcmMap { flex: 1; height: auto !important; }
  body.map-fullscreen-active { overflow: hidden; }
  .map-expand-btn {
    display: flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: var(--radius-sm);
    color: var(--text-muted); background: transparent; border: none; cursor: pointer;
  }
  .map-expand-btn:hover { background: var(--bg); color: var(--text-primary); }
</style>
<div id="rcmBackdrop" onclick="toggleRcmFullscreen()"></div>
<div class="card" id="rcmCard" style="margin-top:18px">
  <div class="card-header">
    <span class="card-title">Client Coverage Map</span>
    <span class="badge" id="rcmCount" style="margin-left:auto">0</span>
    <button type="button" class="map-expand-btn" onclick="toggleRcmFullscreen()" title="Full screen" id="rcmExpandBtn">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
      </svg>
    </button>
  </div>
  <div class="card-body">
    <div id="rcmMap" style="height:440px;border-radius:var(--radius);background:var(--bg-subtle,rgba(0,0,0,.03))"></div>
    <div id="rcmEmpty" style="display:none;padding:20px;text-align:center;font-size:13px;color:var(--text-muted)">
      No client operating regions defined yet.
    </div>
    <div id="rcmLegend" style="display:flex;flex-wrap:wrap;gap:6px 14px;padding:12px 4px 2px;font-size:12.5px"></div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
<script>
(function () {
  const OLA_KEY = {{ ola_maps_api_key|tojson }};
  // 12 well-separated hues; adjacent (touching/overlapping) client shapes are
  // greedy-coloured to differ, so neighbours never share a colour.
  const PALETTE = ['#E2703A','#3B6FB5','#0C7A64','#B5485D','#7A5CB8','#C98F1B',
                   '#2E9E88','#C9455C','#4C6EF5','#E8590C','#0CA678','#AE3EC9'];
  const esc = s => String(s ?? '').replace(/[&<>"']/g,
    m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const clientLinkHtml = p =>
    `<a href="/clients/${encodeURIComponent(p.client_id)}" class="rcm-client-link" style="font-weight:700">${esc(p.name)}</a>`;

  let map;
  let lastData = null;      // last-rendered FeatureCollection, redrawn after a theme-driven restyle
  let handlersBound = false; // layer click/hover handlers are bound once, ever — setStyle() wipes
                              // the layer but not map-level delegated listeners, so re-adding them
                              // on every restyle would stack duplicate popups
  let forceRebuild = false; // set right before map.setStyle(): MapLibre keeps the OLD style (and
                             // its sources) alive until the new style's fetch finishes, so
                             // getSource() keeps returning the soon-to-vanish old source for a
                             // while — this flag stops drawOnMap from being fooled into "reusing"
                             // it via setData() instead of re-adding fresh once the swap lands
  const olaStyleUrl = dark =>
    `https://api.olamaps.io/tiles/vector/v1/styles/${dark ? 'default-dark-standard' : 'default-light-standard'}/style.json`;
  // Reused across hover events so we never stack popups.
  const hoverPopup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 6 });

  function toMultiPolygon(geoms) {
    const polys = [];
    geoms.forEach(g => {
      if (!g) return;
      if (g.type === 'Polygon') polys.push(g.coordinates);
      else if (g.type === 'MultiPolygon') g.coordinates.forEach(c => polys.push(c));
    });
    return { type: 'MultiPolygon', coordinates: polys };
  }

  // Dissolve one client's regions into a single outline; fall back to a plain
  // MultiPolygon (undissolved but still one styled feature) if union chokes.
  function mergeGeoms(geoms) {
    try {
      let merged = turf.feature(geoms[0]);
      for (let i = 1; i < geoms.length; i++) {
        const u = turf.union(merged, turf.feature(geoms[i]));
        if (u) merged = u;
      }
      return merged.geometry;
    } catch (e) {
      return toMultiPolygon(geoms);
    }
  }

  function assignColors(shapes) {
    // adjacency by intersection
    const adj = shapes.map(() => new Set());
    for (let i = 0; i < shapes.length; i++) {
      for (let j = i + 1; j < shapes.length; j++) {
        let touch = false;
        try { touch = turf.booleanIntersects(shapes[i].feature, shapes[j].feature); }
        catch (e) { touch = false; }
        if (touch) { adj[i].add(j); adj[j].add(i); }
      }
    }
    // Prefer a spread-out colour per client (index-based) for visual variety,
    // then bump to the next free one if a neighbour already took it — so
    // adjacent shapes are always different, but distant ones still vary too.
    const colorIdx = new Array(shapes.length).fill(-1);
    for (let i = 0; i < shapes.length; i++) {
      const used = new Set();
      adj[i].forEach(n => { if (colorIdx[n] >= 0) used.add(colorIdx[n]); });
      let c = i % PALETTE.length, tries = 0;
      while (used.has(c) && tries < PALETTE.length) { c = (c + 1) % PALETTE.length; tries++; }
      colorIdx[i] = c;
    }
    return colorIdx;
  }

  function boundsOf(features) {
    const b = new maplibregl.LngLatBounds();
    features.forEach(f => {
      const rings = f.geometry.type === 'MultiPolygon'
        ? f.geometry.coordinates.flat() : f.geometry.coordinates;
      rings.forEach(ring => ring.forEach(pt => b.extend(pt)));
    });
    return b;
  }

  function render(clients) {
    const shapes = clients
      .filter(c => c.geometries && c.geometries.length)
      .map(c => ({ client_id: c.client_id, name: c.name,
                   feature: turf.feature(mergeGeoms(c.geometries)) }))
      .filter(s => s.feature && s.feature.geometry);

    document.getElementById('rcmCount').textContent = shapes.length;
    const legend = document.getElementById('rcmLegend');
    if (!shapes.length) {
      document.getElementById('rcmMap').style.display = 'none';
      document.getElementById('rcmEmpty').style.display = '';
      legend.innerHTML = '';
      return;
    }

    const colorIdx = assignColors(shapes);
    const features = shapes.map((s, i) => {
      let center = null;
      try { center = turf.centerOfMass(s.feature).geometry.coordinates; }
      catch (e) {
        try { center = turf.centroid(s.feature).geometry.coordinates; } catch (e2) { center = null; }
      }
      s.feature.properties = {
        client_id: s.client_id,
        name: s.name,
        color: PALETTE[colorIdx[i] % PALETTE.length],
        centerLng: center ? center[0] : null,
        centerLat: center ? center[1] : null,
      };
      return s.feature;
    });

    // Legend renders immediately, independent of the map — even if the tile
    // style is still loading, the colour key is available right away.
    legend.innerHTML = shapes.map((s, i) => `
      <span style="display:flex;align-items:center;gap:6px;max-width:220px">
        <span style="width:11px;height:11px;border-radius:3px;flex-shrink:0;background:${PALETTE[colorIdx[i] % PALETTE.length]}"></span>
        <a href="/clients/${s.client_id}" class="rcm-client-link" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(s.name)}">${esc(s.name)}</a>
      </span>`).join('');

    lastData = { type: 'FeatureCollection', features };
    drawOnMap(lastData);
  }

  // Try the source/layer additions optimistically — they usually succeed even
  // before the style reports fully loaded. Only if they actually throw (style
  // genuinely not ready) do we retry on the next idle.
  function drawOnMap(data, attempt, opts) {
    attempt = attempt || 0;
    opts = opts || {};
    try {
      if (!forceRebuild && map.getSource('rcm-regions')) {
        map.getSource('rcm-regions').setData(data);
      } else {
        map.addSource('rcm-regions', { type: 'geojson', data });
        map.addLayer({ id: 'rcm-fill', type: 'fill', source: 'rcm-regions',
          paint: { 'fill-color': ['get', 'color'], 'fill-opacity': 0.4 } });
        map.addLayer({ id: 'rcm-line', type: 'line', source: 'rcm-regions',
          paint: { 'line-color': ['get', 'color'], 'line-width': 1.5 } });
        forceRebuild = false;
      }
      // Bound once, ever — a restyle removes the layer but map-level
      // delegated listeners (keyed by layer id) survive it, so re-adding
      // them here on every redraw would stack duplicate popups.
      if (!handlersBound) {
        handlersBound = true;
        map.on('click', 'rcm-fill', (e) => {
          new maplibregl.Popup({ offset: 6 }).setLngLat(e.lngLat)
            .setHTML(clientLinkHtml(e.features[0].properties)).addTo(map);
        });
        // Hover: a transient popup with the client name, anchored at the area's
        // centre (not the cursor) so it labels the whole region it belongs to.
        map.on('mousemove', 'rcm-fill', (e) => {
          map.getCanvas().style.cursor = 'pointer';
          const p = e.features[0].properties;
          const at = (p.centerLng != null && p.centerLat != null) ? [p.centerLng, p.centerLat] : e.lngLat;
          hoverPopup.setLngLat(at).setHTML(clientLinkHtml(p)).addTo(map);
        });
        map.on('mouseleave', 'rcm-fill', () => {
          map.getCanvas().style.cursor = '';
          hoverPopup.remove();
        });
      }
      if (!opts.skipFit) map.fitBounds(boundsOf(data.features), { padding: 30, animate: false });
    } catch (e) {
      // 'idle' has proven unreliable as a retry trigger in some environments
      // (can simply never fire) — a plain poll is the resilient option here,
      // same as the initial-load readiness check just below.
      if (attempt < 30) { setTimeout(() => drawOnMap(data, attempt + 1, opts), 200); return; }
      console.error('RCM drawOnMap failed after retries:', e);
    }
  }

  function loadData() {
    fetch('/clients/regions/all')
      .then(r => r.json())
      .then(render)
      .catch((e) => {
        console.error('RCM render failed:', e);
        document.getElementById('rcmMap').style.display = 'none';
        document.getElementById('rcmEmpty').textContent = 'Could not load coverage data.';
        document.getElementById('rcmEmpty').style.display = '';
      });
  }

  map = new maplibregl.Map({
    container: 'rcmMap',
    style: olaStyleUrl(document.body.classList.contains('dark')),
    center: [78.9, 23.5],
    zoom: 3.5,
    transformRequest: (url) => {
      if (url.startsWith('https://api.olamaps.io')) {
        const sep = url.includes('?') ? '&' : '?';
        return { url: `${url}${sep}api_key=${OLA_KEY}` };
      }
      return { url };
    },
  });
  map.addControl(new maplibregl.NavigationControl(), 'top-left');

  // 'load' can hang waiting for a first paint in some environments; poll the
  // style/tiles readiness as a backstop so the data still renders.
  let ready = false;
  const go = () => { if (ready) return; ready = true; loadData(); };
  map.on('load', go);
  (function poll(n) {
    if (ready) return;
    if (map.isStyleLoaded() || map.areTilesLoaded() || n > 15) { go(); return; }
    setTimeout(() => poll(n + 1), 200);
  })(0);

  // The base map style (light/dark) doesn't follow prefers-color-scheme —
  // it's swapped explicitly whenever the site-wide theme toggle fires, then
  // our layer is redrawn (setStyle wipes custom sources/layers).
  window.addEventListener('ledger:theme-changed', (e) => {
    forceRebuild = true;
    map.setStyle(olaStyleUrl(e.detail.dark));
    if (lastData) drawOnMap(lastData, 0, { skipFit: true });
  });

  const EXPAND_ICON = '<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>';
  const COLLAPSE_ICON = '<path d="M9 3v3a2 2 0 0 1-2 2H4m16 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M4 15h3a2 2 0 0 1 2 2v3"/>';
  // Exposed globally — called from the button's inline onclick, but stays a
  // closure over `map` so it can trigger the resize MapLibre needs after its
  // container's size changes outside its own control.
  window.toggleRcmFullscreen = function () {
    const isFull = document.getElementById('rcmCard').classList.toggle('map-fullscreen');
    document.getElementById('rcmBackdrop').classList.toggle('active', isFull);
    document.body.classList.toggle('map-fullscreen-active', isFull);
    const btn = document.getElementById('rcmExpandBtn');
    btn.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${isFull ? COLLAPSE_ICON : EXPAND_ICON}</svg>`;
    btn.title = isFull ? 'Exit full screen' : 'Full screen';
    setTimeout(() => map.resize(), 50);
  };
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.getElementById('rcmCard').classList.contains('map-fullscreen')) {
      window.toggleRcmFullscreen();
    }
  });
})();
</script>
{% endif %}
